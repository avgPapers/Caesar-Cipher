<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Chiper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Caesar Chiper</h1>

        <div class="input-container">
            <input type="text" id="input1" placeholder="Masukkan Pesan">
            <input type="number" id="input2" placeholder="Masukkan Kunci">
        </div>

        <div class="output-container">
            <input type="text" id="outputEnkripsi" readonly placeholder="Hasil Enkripsi">
            <input type="text" id="outputDeskripsi" readonly placeholder="Hasil Deskripsi">
        </div>

        <div class="button-container">
            <button onclick="enkrip()">Enkripsi</button>
            <button onclick="deskrip()">Deskripsi</button>
            <button onclick="reset()"> Reset </button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
